spec_version: "0.1.0"
name: compliance-auditor
version: 1.0.0
description: Regulatory compliance oversight, AML/OFAC validation, and immutable audit logging
author: Sentinel Risk Systems
license: Apache-2.0

model:
  preferred: claude-sonnet-4-5-20250929
